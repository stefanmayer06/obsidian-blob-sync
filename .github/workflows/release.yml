name: Release

# Attaches main.js, manifest.json and styles.css to a GitHub release. BRAT and
# manual installs download these files from the release, not from the repository.
# Each file gets a signed build provenance attestation, so anyone can verify it
# was built from this repository by this workflow:
#   gh attestation verify main.js --repo stefanmayer06/obsidian-blob-sync
#
# Runs when a version tag is pushed, including the tag GitHub creates when you
# publish a release on the website. If the release already exists, the files are
# added to it. Run it by hand ("Run workflow") to (re)attach the files to an
# existing release.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the files to (e.g. 1.0.0)"
        required: true

permissions:
  contents: write # create the release and upload its files
  id-token: write # sign the attestations (Sigstore)
  attestations: write # store the attestations
  artifact-metadata: write # record the attested files

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match the version in manifest.json ('$version'). Obsidian and BRAT need them to be identical (no 'v' prefix)."
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Attach files to the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes --verify-tag
          fi
